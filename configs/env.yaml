simulation_period:
  base_year: 2025
  final_year: 2060

fleet_size: 10

diesel_price:
  initial_price: 18.0
  growth_rate: 0.01
  volatility: 0.02

electricity_price:
  initial_price: 3.0
  growth_rate: 0.0
  volatility: 0.04

diesel_vehicle:
  initial_price: 1600000.0

electric_vehicle:
  initial_price: 3200000.0
  long_term_mean: 1600000.0
  mean_reversion_strength: 0.2
  purchase_price_volatility: 100000.0

bet_productivity:
  start: 0.7
  max: 0.95
  k: 0.3
  t0: 2045

# Multiplier for BET variants 1..3.
bet_variant_multipliers: [1.0, 1.2, 1.35]

fleet_initialization:
  # Fraction of fleet initialized as diesel in reset.
  initial_diesel_fraction: 0.7
  initial_age_min: 0
  initial_age_max: 7

operational:
  fuel_consumption_l_per_km: 0.6
  electricity_consumption_kwh_per_km: 2.5
  driver_salary_annual: 400000
  income_per_km: 30
  annual_mileage_km: 130000

loan:
  interest_rate: 0.03
  fraction: 0.8
  economic_lifetime: 5

vehicle_management:
  max_age: 7
  max_replacements: 1

residual_value:
  initial_depreciation: 0.2
  annual_depreciation_rate: 0.04
  market_elasticity: 1.0
  floor_fraction: 0.1

discount:
  gamma: 0.9
