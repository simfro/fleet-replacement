simulation_period:
  base_year: 2025
  final_year: 2045

diesel_price:
  initial_price: 18.0
  growth_rate: 0.01
  volatility: 0.02

electricity_price:
  initial_price: 3.0
  growth_rate: 0.0
  volatility: 0.04

DT_price:
  initial_price: 1600000.0

BET_price:
  initial_price: 3200000.0
  long_term_mean: 1600000.0
  mean_reversion_strength: 0.2
  purchase_price_volatility: 100000.0

BET_productivity:
  start: 0.7
  max: 0.95
  k: 0.3
  t0: 2035

operational:
  fuel_consumption_l_per_km: 0.6
  electricity_consumption_kwh_per_km: 2.5
  driver_salary_annual: 400000
  income_per_km: 30
  annual_mileage_km: 130000

economic:
  interest_rate: 0.03
  loan_fraction: 0.8
  economic_lifetime: 5
  discount_factor: 0.9

vehicle_management:
  fleet_size: 8
  max_age: 7
  max_replacements: 1

residual_value:
  initial_depreciation: 0.2
  annual_depreciation_rate: 0.04
  market_elasticity: 1.0
  floor_fraction: 0.1

lookahead:
  horizon: 10
  forecast_rates:
    diesel_price_growth: 0.01 # Diesel prices rise ~1 % p.a.
    electricity_price_growth: 0.0 # Electricity prices held flat
    purchase_price_growth_DT: 0.0 # DT prices constant
    purchase_price_growth_BET: -0.02 # BET prices fall ~2 % p.a.
    BET_productivity_growth: 0.01 # BET productivity grows ~1 % p.a.
